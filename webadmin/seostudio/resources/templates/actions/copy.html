<button class="action-button" data-action="copy">
	<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-clipboard" width="44" height="44" viewBox="0 0 24 24" stroke-width="1.5" stroke="#2c3e50" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<path stroke="none" d="M0 0h24v24H0z" fill="none"/>
		<path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
		<rect x="9" y="3" width="6" height="4" rx="2" />
	</svg>
	<span>
		{{ "Copy" | rt }}
	</span>
	<div class="checkmark">
		<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-check" width="44" height="44" viewBox="0 0 24 24" stroke-width="1.5" stroke="#2c3e50" fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path stroke="none" d="M0 0h24v24H0z" fill="none"/>
			<path d="M5 12l5 5l10 -10" />
		</svg>
	</div>
</button>

<script>
	var buttons = document.querySelectorAll('.action-button[data-action="copy"]');

	if (!force_show_copy && typeof window.navigator.clipboard == 'undefined') {
		buttons.forEach(function(element) {
			element.remove();
		});
	}
</script>
