<style type="text/css">
    .status-label {
        display: inline-block;
        background-color: #999;
        border-radius: 3px;
        padding: 2px 4px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        margin-right: 5px;
    }

    .status-label.blue { background-color: #3da4f0; }
    .status-label.green { background-color: #71c242; }
    .status-label.orange { background-color: #fdb646; }
</style>

<div class="form-container">
    <h2>{{Select Region}}</h2>

    <form action="" method="POST">
        <div class="tool-form">
            <div class="input">
                <select name="region" class="select-input">
                    [[REGIONS]]
                </select>
            </div>
            <div class="button">
                <button type="submit" class="loadable">{{Test}}</button>
            </div>
        </div>
    </form>
</div>
